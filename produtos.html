<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Calcula Fácil - Meus Produtos</title>


<link rel="stylesheet" href="style.css?v=5">


<style>

/* ==========================================
   MEUS PRODUTOS
========================================== */

.produtos-container {

    width:100%;
    max-width:1000px;
    margin:0 auto;
    padding:25px 15px 40px;

}


.produtos-card {

    background:#fff;
    border-radius:18px;
    padding:25px;
    box-shadow:0 10px 35px rgba(0,0,0,.10);

}


/* CABEÇALHO */

.produtos-header {

    text-align:center;
    margin-bottom:20px;

}


.produtos-header img {

    width:100%;
    max-width:330px;
    display:block;
    margin:auto;

}


.produtos-header h1 {

    color:#123b87;
    font-size:26px;

}


.produtos-header p {

    color:#777;

}


/* TOPO */

.produtos-topo {

    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
    background:#f5f7fb;
    padding:12px;
    border-radius:12px;

}


.usuario-produtos {

    color:#444;
    font-size:14px;

}


.acoes-topo {

    display:flex;
    gap:8px;
    flex-wrap:wrap;

}


.btn-produto {

    border:none;
    border-radius:8px;
    padding:10px 14px;
    cursor:pointer;
    font-weight:600;

}


.btn-voltar {

    background:#e9edf5;

}


.btn-novo {

    background:#125bea;
    color:white;

}


.btn-sair {

    background:#eee;

}


/* ==========================================
   BUSCA
========================================== */

.busca-produtos {

    margin:20px 0;
    padding:15px;
    background:#f7f9fd;
    border-radius:12px;
    border:1px solid #e3e8f2;

}


.busca-produtos label {

    display:block;
    font-weight:700;
    color:#334;
    margin-bottom:8px;

}


.busca-produtos input {

    width:100%;
    box-sizing:border-box;
    padding:13px;
    border:1px solid #ccd5e4;
    border-radius:8px;
    font-size:16px;

}


.busca-produtos input:focus {

    outline:none;
    border-color:#125bea;

}


/* ==========================================
   FORMULÁRIO
========================================== */

.form-produto {

    display:none;
    padding:20px;
    background:#f7f9fd;
    border-radius:14px;
    margin-bottom:25px;

}


.form-produto.ativo {

    display:block;

}


.form-grid {

    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:14px;

}


.campo-produto {

    display:flex;
    flex-direction:column;
    gap:6px;

}


.campo-produto label {

    font-size:13px;
    font-weight:bold;

}


.campo-produto input {

    padding:12px;
    border-radius:8px;
    border:1px solid #ccd5e4;
    font-size:16px;

}


.campo-produto input:focus {

    outline:none;
    border-color:#125bea;

}


.campo-produto input[readonly] {

    background:#eef3fb;
    font-weight:600;
    color:#333;

}


.form-acoes {

    margin-top:18px;
    display:flex;
    gap:10px;

}


.btn-salvar {

    background:#168544;
    color:white;

}


.btn-cancelar {

    background:#ddd;

}


/* ==========================================
   MENSAGEM
========================================== */

.produto-mensagem {

    margin-top:12px;
    font-size:14px;
    font-weight:600;

}


.produto-mensagem.erro {

    color:#c62828;

}


.produto-mensagem.sucesso {

    color:#168544;

}


/* ==========================================
   LISTA
========================================== */

.lista-titulo {

    color:#123b87;

}


.lista-produtos {

    display:grid;
    gap:12px;

}


.produto-item {

    border:1px solid #e0e5ee;
    border-radius:12px;
    padding:16px;

}


.produto-nome {

    color:#123b87;
    font-size:18px;
    font-weight:bold;

}


.produto-sku {

    color:#888;
    font-size:12px;

}


.produto-valores {

    display:grid;

    grid-template-columns:repeat(4,1fr);

    gap:10px;

    margin-top:15px;

}


.produto-valor {

    background:#f7f9fd;
    padding:10px;
    border-radius:8px;

}


.produto-valor span {

    font-size:11px;
    color:#777;

}


.produto-valor strong {

    display:block;
    margin-top:4px;

}


.produto-lucro strong {

    color:#168544;

}


.produto-acoes {

    display:flex;
    gap:8px;
    margin-top:14px;

}


.btn-editar {

    background:#eaf2ff;
    color:#125bea;

}


.btn-recalcular {

    background:#fff5df;

}


.btn-excluir {

    background:#ffeaea;
    color:#c62828;

}


.lista-vazia {

    text-align:center;
    padding:35px;
    background:#f8f9fb;
    border-radius:12px;

}


@media(max-width:700px){

    .form-grid{

        grid-template-columns:1fr;

    }


    .produto-valores{

        grid-template-columns:repeat(2,1fr);

    }


    .produtos-card{

        padding:18px;

    }

}

</style>

</head>


<body>


<div class="produtos-container">

<div class="produtos-card">


<div class="produtos-header">

<img
    src="logo_calcula_facil.png"
    alt="Calcula Fácil"
>


<h1>
📦 Meus Produtos
</h1>


<p>
Cadastre e gerencie seus produtos.
</p>


</div>


<!-- ======================================
     TOPO
======================================= -->

<div class="produtos-topo">


<div class="usuario-produtos">

👤

<strong id="usuarioLogado">
Cliente
</strong>

</div>



<div class="acoes-topo">


<button
    type="button"
    class="btn-produto btn-voltar"
    onclick="voltarCalculadora()"
>

← Calculadora

</button>



<button
    type="button"
    class="btn-produto btn-novo"
    onclick="novoProduto()"
>

+ Cadastrar Produto

</button>



<button
    type="button"
    class="btn-produto btn-sair"
    onclick="sair()"
>

Sair

</button>


</div>

</div>



<!-- ======================================
     BARRA DE BUSCA
======================================= -->

<div class="busca-produtos">

<label for="buscarProduto">

🔎 Buscar produto

</label>


<input
    type="text"
    id="buscarProduto"
    placeholder="Digite nome, SKU ou categoria..."
>

</div>



<!-- ======================================
     FORMULÁRIO
======================================= -->

<div
    id="formProduto"
    class="form-produto"
>


<h2 id="formTitulo">

Cadastrar Produto

</h2>



<div class="form-grid">


<!-- NOME -->

<div class="campo-produto">

<label>
Nome do Produto
</label>

<input
    type="text"
    id="produtoNome"
    placeholder="Ex.: Passadeira 1,50m"
>

</div>



<!-- SKU -->

<div class="campo-produto">

<label>
Código / SKU
</label>

<input
    type="text"
    id="produtoSku"
    placeholder="Ex.: PASS-150"
>

</div>



<!-- CATEGORIA -->

<div class="campo-produto">

<label>
Categoria
</label>

<input
    type="text"
    id="produtoCategoria"
    placeholder="Ex.: Passadeiras"
>

</div>



<!-- PB -->

<div class="campo-produto">

<label>
PB — Preço Bruto
</label>

<input
    type="number"
    id="produtoPB"
    placeholder="Ex.: 13,20"
    step="any"
    min="0"
>

</div>



<!-- D -->

<div class="campo-produto">

<label>
D — Desconto (%)
</label>

<input
    type="number"
    id="produtoDescontoCusto"
    placeholder="Ex.: 23,5"
    step="any"
    min="0"
    max="99.99"
>

</div>



<!-- PC -->

<div class="campo-produto">

<label>
PC — Preço de Custo
</label>

<input
    type="number"
    id="produtoCusto"
    placeholder="Calculado automaticamente"
    step="any"
    min="0"
    readonly
>

</div>



<!-- LUCRO -->

<div class="campo-produto">

<label>
L — Lucro Desejado (%)
</label>

<input
    type="number"
    id="produtoLucro"
    step="any"
    min="0"
>

</div>



<!-- TAXA -->

<div class="campo-produto">

<label>
TF — Taxa Fixa
</label>

<input
    type="number"
    id="produtoTaxa"
    step="any"
    min="0"
>

</div>



<!-- PD -->

<div class="campo-produto">

<label>
PD — Desconto (%)
</label>

<input
    type="number"
    id="produtoDesconto"
    step="any"
    min="0"
    max="99.99"
>

</div>



<!-- IMPOSTO -->

<div class="campo-produto">

<label>
I — Imposto (%)
</label>

<input
    type="number"
    id="produtoImposto"
    step="any"
    min="0"
    max="99.99"
>

</div>


</div>



<div
    id="produtoMensagem"
    class="produto-mensagem"
></div>



<div class="form-acoes">


<button
    type="button"
    class="btn-produto btn-salvar"
    onclick="salvarProduto()"
>

💾 Salvar Produto

</button>



<button
    type="button"
    class="btn-produto btn-cancelar"
    onclick="cancelarProduto()"
>

Cancelar

</button>


</div>


</div>



<h2 class="lista-titulo">

Produtos cadastrados

</h2>



<div
    id="listaProdutos"
    class="lista-produtos"
>

<div class="lista-vazia">

Carregando produtos...

</div>

</div>


</div>

</div>



<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<!-- LOGIN -->

<script src="login.js?v=3"></script>


<!-- PRODUTOS -->

<script src="produtos.js?v=3"></script>


</body>

</html>
