<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Calcula Fácil - Login</title>


    <link
        rel="stylesheet"
        href="style.css"
    >


    <!-- ==========================================
         AJUSTE DA LOGO
    =========================================== -->

    <style>

        .login-logo {
            width: 100%;
            text-align: center;
            margin-bottom: 25px;
        }


        .login-logo img {
            width: 100%;
            max-width: 330px;
            height: auto;
            display: block;
            margin: 0 auto;
            object-fit: contain;
        }


        @media (max-width: 600px) {

            .login-logo img {
                max-width: 280px;
            }

        }

    </style>

</head>


<body>


    <div class="login-container">


        <div class="login-card">


            <!-- ==================================
                 LOGO CALCULA FÁCIL
            =================================== -->

            <div class="login-logo">

                <img
                    src="logo_calcula_facil.png"
                    alt="Calcula Fácil — Sua ferramenta de cálculo de preço de venda"
                >

            </div>


            <!-- ==================================
                 FORMULÁRIO DE LOGIN
            =================================== -->

            <form id="loginForm">


                <div class="form-group">

                    <label for="usuario">
                        Usuário
                    </label>


                    <input
                        type="text"
                        id="usuario"
                        placeholder="Digite seu usuário"
                        autocomplete="username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="senha">
                        Senha
                    </label>


                    <input
                        type="password"
                        id="senha"
                        placeholder="Digite sua senha"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn-primary"
                >

                    ENTRAR

                </button>


                <p
                    style="
                        text-align: center;
                        margin-top: 15px;
                    "
                >

                    <a href="esqueci-senha.html">

                        Esqueci minha senha

                    </a>

                </p>


            </form>


            <!-- ==================================
                 MENSAGEM DO LOGIN
            =================================== -->

            <div
                id="loginMensagem"
                class="mensagem"
            ></div>


            <!-- ==================================
                 RODAPÉ
            =================================== -->

            <div class="login-footer">

                Sistema Calcula Fácil

            </div>


        </div>


    </div>


    <!-- ==========================================
         SUPABASE
    =========================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- ==========================================
         LOGIN.JS
    =========================================== -->

    <script src="login.js"></script>


</body>

</html>
